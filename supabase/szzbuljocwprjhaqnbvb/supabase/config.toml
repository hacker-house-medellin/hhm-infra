# Supabase CLI / GitHub-integration config for the hacker-house-medellin auth overlay.
# Working directory: supabase/szzbuljocwprjhaqnbvb. Contains no secrets; env(...) values are resolved from ores-sops at runtime.
project_id = "hacker-house-medellin-auth"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "hacker_house_medellin"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# Seeds only ever run on local stacks and preview branches, never production.
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
enable_signup = false
