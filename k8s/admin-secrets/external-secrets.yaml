apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin-web-runtime
  namespace: hhm-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: admin-web-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: hhm/prod/admin-web-runtime
---
