apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: hhm-admin
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-runtime-dns-egress
  namespace: hhm-admin
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [admin-web, admin-api]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-web-to-admin-api
  namespace: hhm-admin
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: admin-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: admin-web
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-web-to-admin-api-egress
  namespace: hhm-admin
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: admin-web
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: admin-api
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-api-to-shared-auth
  namespace: hhm-admin
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: admin-api
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shared-auth
          podSelector:
            matchLabels:
              app.kubernetes.io/name: dd-shared-auth-admin
      ports:
        - { protocol: TCP, port: 8120 }
