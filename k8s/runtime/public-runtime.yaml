apiVersion: v1
kind: ServiceAccount
metadata:
  name: hhm-api
  namespace: hhm
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hhm-web
  namespace: hhm
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hhm-api
  namespace: hhm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hhm-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hhm-api
        hhm.runtime/plane: public-api
    spec:
      serviceAccountName: hhm-api
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: hhm-ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/hacker-house-medellin/hhm-api:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: tcp-realtime
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: hhm-api-runtime-config
            - secretRef:
                name: hhm-api-runtime
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hhm-api
---
apiVersion: v1
kind: Service
metadata:
  name: hhm-api
  namespace: hhm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hhm-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: hhm-api-internal
  namespace: hhm
  labels:
    hhm.network/exposure: cluster-internal-only
spec:
  type: ClusterIP
  internalTrafficPolicy: Cluster
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: hhm-api
  ports:
    - name: tcp-realtime
      protocol: TCP
      appProtocol: hhm.oresoftware.com/realtime-v1
      port: 8090
      targetPort: tcp-realtime
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hhm-web
  namespace: hhm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hhm-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hhm-web
        hhm.runtime/plane: user-web
    spec:
      serviceAccountName: hhm-web
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: hhm-ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/hacker-house-medellin/hhm-web:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: hhm-web-runtime-config
            - secretRef:
                name: hhm-web-runtime
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hhm-web
---
apiVersion: v1
kind: Service
metadata:
  name: hhm-web
  namespace: hhm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hhm-web
  ports:
    - name: http
      port: 8081
      targetPort: http
