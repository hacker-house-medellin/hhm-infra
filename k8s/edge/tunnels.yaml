apiVersion: apps/v1
kind: Deployment
metadata:
  name: hhm-public-tunnel
  namespace: hhm-edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hhm-public-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hhm-public-tunnel
        hhm.edge/plane: public
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared:2026.8.1@sha256:d9ff527dc19799e24d3689058161fb01e752a24be1823577bae54c9c2489275f
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run", "--token-file", "/etc/cloudflared/token"]
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
          volumeMounts:
            - name: token
              mountPath: /etc/cloudflared
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hhm-public-tunnel
      volumes:
        - name: token
          secret:
            secretName: hhm-public-tunnel-token
            items:
              - key: token
                path: token
---
