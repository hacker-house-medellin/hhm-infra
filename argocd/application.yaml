apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hhm-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hacker-house-medellin/hhm-infra.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: hhm-dev
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions: [CreateNamespace=true]
