name: neon-contract
on:
  pull_request:
    paths:
      - "neon/**"
      - ".github/workflows/neon-contract.yml"
  push:
    branches: [main]
    paths:
      - "neon/**"
      - ".github/workflows/neon-contract.yml"

permissions:
  contents: read

concurrency:
  group: neon-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.1
          terraform_wrapper: false
      - run: terraform -chdir=neon/hacker-house-medellin-prod/terraform fmt -check
      - run: terraform -chdir=neon/hacker-house-medellin-prod/terraform init -backend=false -lockfile=readonly -input=false
      - run: terraform -chdir=neon/hacker-house-medellin-prod/terraform validate
      - run: git diff --exit-code
