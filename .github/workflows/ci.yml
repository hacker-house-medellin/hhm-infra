name: CI repair

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Repair key-independent audit contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          module = Path('.just/env.just')
          text = module.read_text()
          old = 'env-check: _env-dec'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one {old!r}, found {text.count(old)}')
          module.write_text(text.replace(old, 'env-check:', 1))

          readme = Path('env/README.md')
          lines = readme.read_text().splitlines()
          marker = '- **No multi-line values.** A PEM must be a single line with `\\n` escapes:'
          matches = [index for index, line in enumerate(lines) if line == marker]
          if len(matches) != 1:
              raise SystemExit(f'expected one PEM documentation marker, found {len(matches)}')
          index = matches[0]
          if index + 1 >= len(lines) or not lines[index + 1].startswith('  `JWT_PRIVATE_KEY='):
              raise SystemExit('credential-shaped documentation example is not in the expected form')
          lines[index:index + 2] = [
              '- **No multi-line values.** Keep PEM material on one dotenv line and represent embedded newlines with escaped `\\n` sequences; never paste a raw private-key block.'
          ]
          readme.write_text('\n'.join(lines) + '\n')
          PY

      - name: Install just
        env:
          JUST_VERSION: 1.51.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just

      - name: Validate repository and key-independent secret audit
        run: |
          set -euo pipefail
          python3 scripts/verify_repo.py
          just env-check
          node --test
          git diff --check

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git add .just/env.just env/README.md
          if git diff --cached --quiet; then
            echo "Audit contract already repaired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: keep secret audit key-independent"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
