name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/verify_repo.py
      - run: python3 scripts/validate_routing.py
      - name: Validate the exact Nginx configuration with the pinned runtime
        run: |
          docker run --rm --entrypoint nginx \
            --add-host hhm-web.hhm.svc.cluster.local:127.0.0.1 \
            --add-host hhm-api.hhm.svc.cluster.local:127.0.0.1 \
            --add-host dd-shared-auth.shared-auth.svc.cluster.local:127.0.0.1 \
            --volume "$PWD/k8s/edge/config/public-nginx.conf:/etc/nginx/nginx.conf:ro" \
            docker.io/nginxinc/nginx-unprivileged:1.29.1-alpine@sha256:27985295bdb22a1ef8f712863210bd5877c0f3006494a593e86b3fe0fa55467e \
            -t -c /etc/nginx/nginx.conf
      - run: node --test
